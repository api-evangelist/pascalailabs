aid: pascalailabs
name: Pascal AI
description: >-
  Pascal AI (Pascal AI Labs) is an institutional-finance AI company building
  context-driven, MCP-native research agents that turn enterprise and market
  data into investment insights for hedge funds, asset managers, investment
  banks, and private-markets firms. Pascal sits inside Excel, PowerPoint, Word,
  email, and the browser through an Agent Control Center, ships 25+ pre-built
  research agents, maintains a persistent knowledge graph and memory across every
  document a team has touched, and returns fully cited outputs with RBAC
  enforcement. It deploys inside the customer VPC or on-premises and exposes an
  enterprise API & SDK (Python, TypeScript, REST) plus finance-ready MCP
  connectors. Founded in 2024 in Bangalore, Pascal AI raised a $3.1M seed round
  in 2025 led by Kalaari Capital with Norwest Venture Partners, Antler, and Info
  Edge Ventures. It publishes SOC 2 Type II, ISO 27001, and GDPR compliance. No
  public API specification or developer portal is published; developer surfaces
  are gated to enterprise customers.
